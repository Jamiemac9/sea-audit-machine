<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#1E2B45; --ink-2:#4A5874; --ink-3:#7B879C;
    --paper:#FAFBFD; --mist:#EEF2F8; --card:#FFFFFF; --line:#D5DCE8; --line-2:#E6EBF3;
    --act:#1E3F6E; --act-hover:#163257;
    --mark:#F5E15A; --mark-soft:#FCF6C9;
    --gold:#B8902B; --green:#2E8B57; --amber:#D07A22; --red:#BF3B2B;
    --gold-bg:#F6EED7; --green-bg:#E2F2E8; --amber-bg:#FBEBDA; --red-bg:#F8E1DD;
    --r-s:6px; --r-m:10px; --r-l:16px;
    --font: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body { font: 15px/1.55 var(--font); color:var(--ink); background:var(--paper); font-variant-numeric: tabular-nums; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--act); }
  :focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; border-radius: 4px; }

  .app { display:grid; grid-template-columns: 236px 1fr; min-height:100vh; }
  .rail { background:var(--ink); color:#E9EEF7; padding:22px 16px; display:flex; flex-direction:column; gap:22px; position:sticky; top:0; height:100vh; }
  .brand { font-weight:700; font-size:19px; padding:0 8px; }
  .brand small { display:block; font-weight:400; font-size:13px; color:#AEB9CC; }
  .nav { display:flex; flex-direction:column; gap:4px; }
  .nav a { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-radius:var(--r-m); color:#DCE3EF; text-decoration:none; }
  .nav a:hover { background:rgba(255,255,255,.07); }
  .nav a.on { background:#fff; color:var(--ink); font-weight:700; }
  .nav .count { background:var(--mark); color:var(--ink); font-weight:700; font-size:12px; border-radius:20px; padding:1px 8px; }
  .health { margin-top:auto; display:flex; flex-direction:column; gap:7px; font-size:13px; padding:0 8px; }
  .health div { display:flex; align-items:center; gap:8px; color:#C9D2E1; }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; background:#6B7891; }
  .dot.ok { background:#5CC48A; } .dot.bad { background:#F07A64; } .dot.wait { background:#E9C850; }
  main { padding:30px 38px 60px; max-width:1240px; width:100%; }
  @media (max-width: 920px) { .app { grid-template-columns: 1fr; } .rail { position:static; height:auto; flex-direction:row; flex-wrap:wrap; align-items:center; } .nav { flex-direction:row; } .health { margin-top:0; } main { padding:22px 18px 50px; } }

  h1 { font-size:28px; line-height:1.2; margin:0 0 4px; }
  h2 { font-size:19px; margin:0 0 12px; }
  h3 { font-size:16px; margin:0 0 8px; }
  .lede { color:var(--ink-2); margin:0 0 24px; max-width:68ch; }
  .muted { color:var(--ink-3); font-size:14px; }
  .bad { color:var(--red); font-weight:700; }
  .why { margin-top:10px; padding:10px 12px; border-left:3px solid var(--red); background:var(--red-bg); border-radius:4px; color:#6E1F13; font-size:14px; white-space:pre-wrap; }
  .why b { display:block; margin-bottom:2px; }
  .note { margin-top:10px; padding:10px 12px; border-left:3px solid var(--amber); background:var(--amber-bg); border-radius:4px; color:#6B3A08; font-size:14px; }
  .bigdrop { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:6px;
    min-height:230px; border:2px dashed #9FB3CC; border-radius:14px; background:var(--card); padding:28px; cursor:pointer; transition:background .15s, border-color .15s; }
  .bigdrop b { font-size:22px; } .bigdrop.over { background:#EAF1FA; border-color:var(--act); }
  .bigdrop.busy { cursor:progress; opacity:.75; }
  .forms { display:flex; gap:10px; flex-wrap:wrap; margin:12px 0 26px; }
  .form-slot { display:flex; align-items:center; gap:10px; padding:10px 14px; border:1px solid #DCE3EA; border-radius:10px; background:var(--card); }
  .form-slot.missing { border-color:var(--amber); background:var(--amber-bg); }
  .form-slot .tick { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:13px; font-weight:700; color:#fff; background:var(--green); }
  .form-slot.missing .tick { background:var(--amber); }
  .rlist { list-style:none; padding:0; margin:0; }
  .btn { white-space:nowrap; }
  #needsBox .needs { margin-bottom:18px; }
  .rlist li { display:grid; grid-template-columns: minmax(180px,1.2fr) 2fr auto; gap:18px; align-items:center; padding:14px 0; border-top:1px solid #E5EAEF; }
  .rlist li:first-child { border-top:0; }
  .rlist a.name { font-weight:700; color:inherit; text-decoration:none; } .rlist a.name:hover { text-decoration:underline; }
  .live { margin-top:6px; font-size:13px; color:#5b6b75; }
  .live.slow { color:#8F4E0E; }
  .ok { color:var(--green); font-weight:700; }
  code.path { background:var(--mist); border:1px solid var(--line-2); padding:1px 6px; border-radius:var(--r-s); font-size:13px; word-break:break-all; user-select:all; font-family: var(--font); }

  .btn { display:inline-flex; align-items:center; gap:6px; border:1px solid transparent; border-radius:var(--r-m); padding:9px 16px; cursor:pointer; background:var(--act); color:#fff; font-weight:700; text-decoration:none; transition: background .15s; }
  .btn:hover { background:var(--act-hover); }
  .btn.quiet { background:var(--card); color:var(--ink); border-color:var(--line); font-weight:400; }
  .btn.quiet:hover { background:var(--mist); }
  .btn.mark { background:var(--mark); color:var(--ink); }
  .btn.mark:hover { background:#EDD540; }
  .btn.danger { background:var(--card); color:var(--red); border-color:#EBC4BD; font-weight:400; }
  .btn.small { padding:5px 11px; font-size:14px; border-radius:var(--r-s); }
  .btn:disabled { opacity:.45; cursor:default; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  label.field { display:block; font-weight:700; font-size:14px; margin:14px 0 5px; }
  input[type=text], textarea, select { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:var(--r-m); background:var(--card); }
  textarea { min-height:64px; resize:vertical; }
  .check { display:flex; gap:9px; align-items:center; margin-top:12px; }
  .check input { width:18px; height:18px; accent-color: var(--act); }

  .panel { background:var(--card); border:1px solid var(--line); border-radius:var(--r-l); padding:22px; }
  .panel + .panel, .stack > * + * { margin-top:18px; }
  .split > .panel { margin-top:0; }
  .split { display:grid; grid-template-columns: 1.15fr 1fr; gap:18px; align-items:start; }
  @media (max-width: 1080px) { .split { grid-template-columns: 1fr; } }

  .needs { background:var(--mark-soft); border:1px solid #EADB7A; border-radius:var(--r-l); padding:18px 20px; }
  .needs h2 span { background:var(--mark); padding:0 8px; border-radius:4px; }
  .needs ul { list-style:none; margin:0; padding:0; }
  .needs li { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-top:1px solid #EFE3A0; }
  .needs li:first-child { border-top:0; }
  .needs.clear { background:var(--card); border-color:var(--line); }

  .stats { display:grid; grid-template-columns: repeat(4, 1fr); gap:18px; margin:22px 0; }
  @media (max-width: 1080px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:var(--r-l); padding:16px 18px; }
  .stat b { display:block; font-size:30px; line-height:1.1; }
  .stat span { color:var(--ink-2); font-size:14px; }
  .bandbar { display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--mist); margin:10px 0 8px; }
  .bandbar i { display:block; height:100%; transition: width .5s ease; }
  .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:13px; color:var(--ink-2); }
  .legend span::before { content:""; display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; background:var(--c); }

  .track { display:grid; grid-template-columns: repeat(5, 1fr); position:relative; margin:6px 0 2px; }
  .track::before { content:""; position:absolute; left:10%; right:10%; top:13px; height:3px; background:var(--line); border-radius:2px; }
  .track .fill { position:absolute; left:10%; top:13px; height:3px; background:var(--act); border-radius:2px; transition: width .6s ease; }
  .stop { position:relative; text-align:center; font-size:13px; color:var(--ink-3); }
  .stop .pin { width:29px; height:29px; margin:0 auto 6px; border-radius:50%; background:var(--card); border:3px solid var(--line); display:grid; place-items:center; font-weight:700; font-size:13px; color:var(--ink-2); position:relative; z-index:1; transition: all .3s; }
  .stop.past .pin { background:var(--act); border-color:var(--act); color:#fff; }
  .stop.now .pin { border-color:var(--act); color:var(--act); box-shadow:0 0 0 5px rgba(30,63,110,.12); }
  .stop.you .pin { background:var(--mark); border-color:#D9C23A; color:var(--ink); box-shadow:0 0 0 5px rgba(245,225,90,.35); }
  .stop.err .pin { border-color:var(--red); color:var(--red); }
  .stop.past, .stop.now, .stop.you { color:var(--ink); }
  .stop .n { display:block; font-size:12px; color:var(--ink-3); }
  @media (prefers-reduced-motion: no-preference) { .stop.now .pin { animation: pulse 1.8s ease-in-out infinite; } }
  @keyframes pulse { 50% { box-shadow:0 0 0 9px rgba(30,63,110,.06); } }

  .mini { display:flex; gap:3px; width:150px; }
  .mini i { flex:1; height:6px; border-radius:3px; background:var(--line-2); transition: background .3s; }
  .mini i.past { background:var(--act); } .mini i.now { background:#7E9BC4; } .mini i.you { background:var(--mark); } .mini i.err { background:var(--red); }

  .round { display:grid; grid-template-columns: 1.3fr 2fr auto; gap:18px; align-items:center; padding:16px 18px; border:1px solid var(--line); border-radius:var(--r-l); background:var(--card); text-decoration:none; color:inherit; transition: border-color .15s; }
  .round:hover { border-color:#A9B6CB; }
  .round + .round { margin-top:10px; }
  .round .title { font-weight:700; font-size:16px; }
  @media (max-width: 860px) { .round { grid-template-columns: 1fr; } }
  .progress { height:8px; border-radius:4px; background:var(--mist); overflow:hidden; margin-top:6px; }
  .progress i { display:block; height:100%; background:var(--act); transition: width .6s ease; }
  .dots { display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; max-width:220px; }
  .dots i { width:12px; height:12px; border-radius:3px; background:var(--line-2); }
  .dots i.you { background:var(--mark); } .dots i.now { background:#7E9BC4; } .dots i.err { outline:2px solid var(--red); outline-offset:-2px; }
  .empty { text-align:center; padding:40px 20px; color:var(--ink-2); border:1px dashed var(--line); border-radius:var(--r-l); background:var(--card); }

  .band { display:inline-block; padding:2px 10px; border-radius:20px; font-weight:700; font-size:13px; }
  .band.Gold { background:var(--gold-bg); color:#7A5D12; } .band.Green { background:var(--green-bg); color:#1F6B41; }
  .band.Amber { background:var(--amber-bg); color:#8F4E0E; } .band.Red { background:var(--red-bg); color:#8E2416; }
  .c-Gold { background:var(--gold) !important; } .c-Green { background:var(--green) !important; } .c-Amber { background:var(--amber) !important; } .c-Red { background:var(--red) !important; }
  .score { display:flex; align-items:center; gap:8px; font-size:14px; }
  .score .bar { width:70px; height:6px; border-radius:3px; background:var(--mist); overflow:hidden; }
  .score .bar i { display:block; height:100%; }

  .res { list-style:none; margin:0; padding:0; }
  .res > li { border-top:1px solid var(--line-2); padding:14px 0; }
  .res > li:first-child { border-top:0; }
  .res .line { display:grid; grid-template-columns: 1.4fr 160px 1.3fr 170px; gap:16px; align-items:center; }
  @media (max-width: 980px) { .res .line { grid-template-columns: 1fr 1fr; } }
  .res .who b { display:block; }
  .res .acts { margin-top:10px; }
  .result { white-space:pre-wrap; background:var(--mist); border-radius:var(--r-m); padding:12px 14px; font-size:14px; margin-top:10px; }
  pre.log { white-space:pre-wrap; background:#172238; color:#D5DEEC; padding:12px 14px; border-radius:var(--r-m); max-height:280px; overflow:auto; font: 13px/1.5 Consolas, "SF Mono", monospace; margin:10px 0 0; }

  .yourcheck { border:2px solid #E3CF55; background:linear-gradient(var(--mark-soft), #fff 160px); }
  .facts { display:flex; gap:10px; flex-wrap:wrap; margin:10px 0; }
  .facts span { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:3px 11px; font-size:14px; }
  .viewer { display:grid; grid-template-columns: 250px 1fr; gap:14px; margin-top:12px; }
  @media (max-width: 900px) { .viewer { grid-template-columns: 1fr; } }
  .viewer ul { list-style:none; margin:0; padding:0; max-height:560px; overflow:auto; border:1px solid var(--line); border-radius:var(--r-m); background:var(--card); }
  .viewer li { padding:7px 10px; cursor:pointer; font-size:13px; word-break:break-all; border-bottom:1px solid var(--line-2); }
  .viewer li:hover { background:var(--mist); } .viewer li.sel { background:#E4ECF7; font-weight:700; }
  .page { border:1px solid var(--line); border-radius:var(--r-m); background:var(--mist); padding:10px; min-height:300px; }
  .page img { max-width:100%; max-height:72vh; display:block; margin:0 auto; box-shadow:0 1px 3px rgba(30,43,69,.15); background:#fff; }
  .page pre { white-space:pre-wrap; font-size:13px; margin:0; background:#fff; padding:12px; }
  .names { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .names label { display:flex; gap:6px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:3px 10px; font-size:14px; cursor:pointer; }

  .drop { border:2px dashed #A9B6CB; border-radius:var(--r-l); padding:30px; text-align:center; background:var(--card); transition: all .15s; }
  .drop.over { border-color:var(--act); background:#EEF3FA; }
  .drop b { font-size:17px; display:block; margin-bottom:4px; }
  .chosen { margin-top:12px; padding:10px 14px; border-radius:var(--r-m); background:var(--mark-soft); border:1px solid #EADB7A; font-weight:700; display:none; }
  .or { display:flex; align-items:center; gap:12px; color:var(--ink-3); margin:18px 0; font-size:14px; }
  .or::before, .or::after { content:""; flex:1; height:1px; background:var(--line); }

  .todo { list-style:none; margin:0; padding:0; }
  .todo li { display:grid; grid-template-columns: 26px 1fr auto; gap:12px; padding:14px 0; border-top:1px solid var(--line-2); align-items:start; }
  .todo li:first-child { border-top:0; }
  .tick { width:22px; height:22px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; font-size:13px; font-weight:700; margin-top:1px; }
  .tick.done { background:var(--green); border-color:var(--green); color:#fff; }
  .tick.need { border-color:var(--amber); color:var(--amber); }
  .files { list-style:none; margin:8px 0 0; padding:0; font-size:14px; max-height:180px; overflow:auto; }
  .files li { display:flex; justify-content:space-between; gap:8px; padding:4px 0; border-top:1px solid var(--line-2); }

  .toast { position:fixed; bottom:22px; right:22px; background:var(--ink); color:#fff; padding:11px 16px; border-radius:var(--r-m); opacity:0; transform:translateY(8px); transition: all .25s; pointer-events:none; max-width:420px; z-index:9; }
  .toast.show { opacity:1; transform:none; }
  .hidden { display:none !important; }
  details summary { list-style-position: inside; }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">Support Audit<small>Form A, scores and feedback</small></div>
    <nav class="nav">
      <a href="#/" data-r="home"><span>Audits</span><span class="count hidden" id="navNeeds"></span></a>
      <a href="#/setup" data-r="setup"><span>Forms and settings</span><span class="count hidden" id="navSetup"></span></a>
    </nav>
    <div class="health" id="health"></div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<input type="file" id="folderPick" webkitdirectory multiple hidden>
<input type="file" id="templateFile" accept=".docx" hidden>
<input type="file" id="feedbackFile" accept=".docx" hidden>
<input type="file" id="refFiles" multiple hidden>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path, opts={}) {
  const r = await fetch(path, opts);
  if (!r.ok) { let t = await r.text(); try { t = JSON.parse(t).detail } catch(e){}; throw new Error(t) }
  return (r.headers.get('content-type')||'').includes('json') ? r.json() : r;
}
const post = (path, body) => api(path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{})});
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3200) }
const cache = {};
// only touch the page where something actually changed, so nothing flickers
function put(id, html) { const el = $(id); if (!el) return false; if (cache[id] === html) return false; el.innerHTML = html; cache[id] = html; return true }
const when = iso => { if (!iso) return ''; const d = new Date(iso); return d.toLocaleDateString('en-GB', {day:'numeric', month:'short'}) + ', ' + d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}) };

let S = null, D = null, route = {name:'home'}, view = {path:null, page:1}, openLogs = {}, logPos = {};
let src = {files:[], local:null, label:''};

// ---------- where each resident is on the track ----------
const STOPS = ['Hiding names', 'Your check', 'Claude auditing', 'Names back', 'Done'];
function stopOf(batchStatus, r) {
  if (batchStatus === 'redacting' || r.status === 'waiting') return {i:0, kind:'now'};
  if (r.status === 'check') return {i:1, kind:'you'};
  if (r.status === 'blocked') return {i:1, kind:'err'};
  if (r.status === 'queued') return {i:2, kind:'wait'};
  if (r.status === 'running' || r.status === 'stopping') return (r.activity && r.activity.step >= 8) ? {i:3, kind:'now'} : {i:2, kind:'now'};
  if (r.status === 'done') return {i:4, kind:'past'};
  if (r.status === 'empty') return {i:0, kind:'err'};
  return {i:2, kind:'err'};
}
const statusWords = r => ({waiting:'Hiding names on this computer', check:'Ready for your check', blocked:'Some details could not be hidden',
  queued:'Waiting its turn', running: r.activity ? `${r.activity.doing} (${r.activity.step} of ${r.activity.of})` : 'Claude is auditing',
  stopping:'Stopping', done:'Done', failed:'Did not finish', stopped:'Stopped', empty:'Nothing to audit'}[r.status] || r.status);
const mins = sec => sec < 60 ? 'under a minute' : `${Math.round(sec/60)} min`;
function liveLine(r) {
  if (!['running','stopping'].includes(r.status)) return '';
  const a = r.activity || {}, ran = r.started ? (Date.now() - new Date(r.started)) / 1000 : null;
  const q = a.quiet_seconds, slow = q != null && q > 300;
  return `<div class="live ${slow ? 'slow' : ''}">${ran != null ? `Running for ${mins(ran)}. ` : ''}${q != null ? `Last update ${q < 60 ? 'just now' : mins(q) + ' ago'}.` : ''}${slow ? ' No update for a while: it is usually reading a big file. If nothing changes for 30 minutes it stops itself and says why.' : ''}</div>`;
}
const whyBox = (title, text) => text ? `<div class="why"><b>${esc(title)}</b>${esc(text)}</div>` : '';

function miniTrack(bs, r) {
  const s = stopOf(bs, r);
  return `<div class="mini" title="${esc(STOPS[s.i])}">${STOPS.map((_, i) =>
    `<i class="${i < s.i || s.kind==='past' ? 'past' : i === s.i ? (s.kind==='you' ? 'you' : s.kind==='err' ? 'err' : 'now') : ''}"></i>`).join('')}</div>`;
}
function bigTrack(b) {
  const rs = Object.values(b.residents || {});
  const counts = [0,0,0,0,0]; let err = false, you = false, low = 4;
  const live = rs.filter(r => r.status !== 'empty');   // a resident with nothing to audit doesn't hold the round back
  live.forEach(r => { const s = stopOf(b.status, r); counts[s.i]++; if (s.kind==='err') err = true; if (s.kind==='you') you = true; low = Math.min(low, s.i) });
  const allDone = live.length && live.every(r => r.status === 'done');
  const reach = allDone ? 4 : low;
  return `<div class="track">${STOPS.map((name, i) => {
      const cls = allDone || i < reach ? 'past' : i === reach ? (you && i===1 ? 'you' : err ? 'err' : 'now') : '';
      return `<div class="stop ${cls}"><div class="pin">${allDone || i < reach ? '✓' : i+1}</div>${name}<span class="n">${counts[i] ? counts[i] + (counts[i]===1?' resident':' residents') : '&nbsp;'}</span></div>` }).join('')}
    <div class="fill" style="width:${reach*20}%"></div></div>`;
}
const bandPill = r => r.rating ? `<span class="band ${r.rating}">${r.rating}</span>` : '';

function wireDrop() {
  const d = $('drop');
  d.ondragover = e => { e.preventDefault(); d.classList.add('over') };
  d.ondragleave = () => d.classList.remove('over');
  d.ondrop = async e => {
    e.preventDefault(); d.classList.remove('over');
    const out = [];
    const walk = (entry, prefix) => new Promise(res => {
      if (entry.isFile) entry.file(f => { out.push({file:f, path: prefix + f.name}); res() });
      else { const rd = entry.createReader(), all = [];
        const more = () => rd.readEntries(async es => { if (!es.length) { for (const c of all) await walk(c, prefix + entry.name + '/'); res() } else { all.push(...es); more() } });
        more() }
    });
    for (const it of e.dataTransfer.items) { const en = it.webkitGetAsEntry && it.webkitGetAsEntry(); if (en) await walk(en, '') }
    send(out);
  };
}

      <div class="split"><div class="panel"><h2>Checklist</h2><ul class="todo" id="todo"></ul></div>
      <div class="stack"><div class="panel"><h2>Privacy</h2>
        <label class="field" for="hideNames">Names to always hide</label>
        <div class="muted">Support workers, managers and anyone else who comes up a lot. One per line.</div>
        <textarea id="hideNames" style="margin-top:6px; min-height:110px"></textarea>
        <label class="check"><input type="checkbox" id="checkFirst"> Stop each round so I can check the hidden copy before it goes to Claude (off: it just runs)</label>
        <label class="field" for="outDir">Save finished forms in</label>
        <input type="text" id="outDir">
        <div class="muted" style="margin-top:4px">Each round gets its own folder in here, named after the folder you dropped. Folders copied into <code class="path">${esc(s.folders.inbox)}</code> start by themselves and save into a Completed Audits folder next to them.</div>
        <div class="row" style="margin-top:14px"><button class="btn" onclick="saveSettings()">Save settings</button></div></div>
      <div class="panel" id="refPanel"></div></div></div></div>`;
    $('hideNames').value = s.settings.hide_names.join('\n'); $('outDir').value = s.settings.output_dir; $('checkFirst').checked = s.settings.check_before_sending;
    delete cache['todo']; delete cache['refPanel']; delete cache['setupForms'];
  }
  put('setupForms', formSlots(s));
  const li = s.login.loggedIn;
  const item = (ok, title, body, action='') => `<li><span class="tick ${ok?'done':'need'}">${ok?'✓':'!'}</span><div><b>${title}</b><div class="muted">${body}</div></div><div>${action}</div></li>`;
  put('todo',
    item(li===true, 'Claude is logged in', li===true ? 'Audits run on your Claude account.' : 'Log in once on this computer.', li===true ? '' : `<button class="btn mark small" onclick="claudeLogin()">Log in</button>`) +
    item(!!s.template, 'Blank Support Audit form', s.template ? `Using ${esc(s.template)}` : `Put Support_Audit_OG.docx in <code class="path">${esc(s.folders.template)}</code>`, `<button class="btn quiet small" onclick="templateFile.click()">Add</button>`) +
    item(!!s.feedback_template, 'Blank Overall Feedback Form', s.feedback_template ? `Using ${esc(s.feedback_template)}` : `Put it in the same folder: <code class="path">${esc(s.folders.template)}</code>`) +
    item(s.reference.length > 0, 'Reference files', s.reference.length ? `${s.reference.length} files: house style, rules and your completed audits.` : `House style, rules, your SKILL.md and completed audits go in <code class="path">${esc(s.folders.reference)}</code>`, `<button class="btn quiet small" onclick="refFiles.click()">Add</button>`) +
    item(s.tools.name_finder && s.tools.ocr && s.tools.office, 'Helpers installed', `Name finder ${s.tools.name_finder?'on':'off'}, scan reader ${s.tools.ocr?'on':'off'}, Word converter ${s.tools.office?'on':'off'}.`) +
    (s.template_others.length ? item(true, 'Other forms in the template folder', `Not used: ${s.template_others.map(esc).join(', ')}`) : ''));
  put('refPanel', `<h2>Reference files</h2><div class="muted">Names in these are hidden too before Claude reads them.</div>
    <ul class="files">${s.reference.map(n => `<li><span>${esc(n)}</span><button class="btn quiet small" onclick="delRef('${encodeURIComponent(n)}')">Remove</button></li>`).join('') || '<li class="muted">None yet</li>'}</ul>
    ${s.reference_held_back.length ? `<p class="bad">Not given to Claude, because they could not be hidden safely: ${s.reference_held_back.map(esc).join(', ')}</p>` : ''}
    <div class="row" style="margin-top:10px"><button class="btn quiet small" onclick="refFiles.click()">Add reference files</button></div>`);
}
async function saveSettings() {
  try { await post('/api/settings', {hide_names: $('hideNames').value.split('\n'), output_dir: $('outDir').value, check_before_sending: $('checkFirst').checked}); toast('Settings saved.') } catch(e) { toast(e.message) }
}
async function addForm(e, kind) { const f = e.target.files[0]; e.target.value=''; if (!f) return;
  const fd = new FormData(); fd.append('file', f); fd.append('kind', kind);
  try { await api('/api/template', {method:'POST', body:fd}); toast(kind === 'feedback' ? 'Overall Feedback Form stored.' : 'Support Audit form stored.') } catch(err) { toast(err.message) } tick() }
$('templateFile').onchange = e => addForm(e, 'audit');
$('feedbackFile').onchange = e => addForm(e, 'feedback');
$('refFiles').onchange = async e => { const fd = new FormData(); for (const f of e.target.files) fd.append('files', f); e.target.value='';
  try { await api('/api/reference', {method:'POST', body:fd}); toast('Reference files added.') } catch(err) { toast(err.message) } tick() };
async function delRef(n) { await api('/api/reference/'+n, {method:'DELETE'}); toast('Removed.'); tick() }
async function claudeLogin() {
  try { await post('/api/login') } catch(e) { return toast(e.message) }
  alert('A window has opened to sign Claude in. A browser page asks you to log in to your Claude account. When it says you are logged in, close that window. This page updates within a few seconds.');
}

// ---------- routing and the loop ----------
function readRoute() {
  const h = location.hash.replace(/^#\/?/, '');
  if (h.startsWith('round/')) return {name:'round', id:h.slice(6)};
  if (h === 'setup') return {name:'setup'};
  return {name:'home'};
}
window.onhashchange = () => {
  const r = readRoute();
  if (r.name !== route.name || r.id !== route.id) {
    route = r; for (const k in cache) delete cache[k]; $('main').innerHTML = ''; D = null; openLogs = {}; logPos = {}; view = {path:null, page:1};
    window.scrollTo(0, 0); tick();
  }
};
let busy = false;
async function tick() {
  if (busy) return; busy = true;
  try {
    S = await api('/api/state');
    renderRail();
    if (route.name === 'round') {
      try { D = await api('/api/batches/' + route.id) } catch(e) { D = null; location.hash = '#/'; return }
      renderRound(); await pollLogs();
    }
    else if (route.name === 'setup') renderSetup();
    else renderHome();
  } catch(e) { put('main', `<div class="empty"><h3>Support Audit isn't responding</h3><p>Close this page and open Support Audit from the desktop icon again.</p></div>`) }
  finally { busy = false }
}
route = readRoute(); tick(); setInterval(tick, 2500);
</script>
